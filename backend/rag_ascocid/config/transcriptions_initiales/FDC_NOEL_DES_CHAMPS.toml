Variété: NOEL DES CHAMPS
PRINCIPALES ZONES DE PRODUCTION
Calvados : Centre et sud du Pays d'Auge.
POSSIBILITES DE COMMERCIALISATION
en bonne année : 1.500 tonnes.
Ph. Desmier de Chenon
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. jacquin du 4 janvier 1965)
Dégustation du jus : doux amer.
Dégustation du cidre : doux amer.
Rendement en jus (%) : 53,7.
Densité du jus : 1078,5 - Alcool en puissance : 10°.
Acidité de titration en g. SO'‘H: par litre : 1,07.
Azote/sucres totaux : 0,28.
Tanin (en g. par litre) : 2,96.
Parfum : léger.
QUALITES CULTURALES DE L'ARBRE
Vigueur : très grande.
Port : cône retombant.
Résistance aux maladies : très grande (légère sensibilité aux pucerons
sur feuilles).
Productivité : bonne.
Saison de floraison : fin 3e.
Saison de maturité : 3°.
Conservation et transport des fruits : très bons.
Calibre du fruit : moyen à petit.
Précocité de mise à fruits: assez bonne sur porte-greffes de multiplica-
tion végétative.
OBSERVATIONS DIVERSES
Brassage en janvier-février. Variété recommandée pour la fabrication de
cidres doux et de cidres mousseux.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Poris (1er)
Edition 1966"""

