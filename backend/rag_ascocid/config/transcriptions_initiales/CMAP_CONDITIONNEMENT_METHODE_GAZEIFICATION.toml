texte_ocr = """
La méthode de conditionnement avec gazéification
est une : Modalité de l’étape de conditionnement et obtention de l’effervescence des cidres
est constitué de : Une désaération (facultative) | Une stabilisation microbienne (facultative) | Une gazéification en saturateur | Un embouteillage iso -barométrique | Un bouchage & muselage
a pour action complémentaire : Un sulfitage et/ou ajout d’acide ascorbique (facultatif)
a pour fonctions : De produire un cidre effervescent par un apport contrôlé de CO 2 exogène | De conditionner en bouteille un cidre en général limpide | D’obtenir rapidement un cidre prêt à la commercialisation
a pour conséquences : De permettre une saturation précise en CO 2 en fonction de l’effet recherché | De limiter la quantité de flores indésirables en bouteille
présente le risque : D’une oxygénation du cidre à la gazéification et à l’embouteillage"""

