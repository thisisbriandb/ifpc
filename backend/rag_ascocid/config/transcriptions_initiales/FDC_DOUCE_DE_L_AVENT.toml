Les ramifications, assez nombreuses avec des angles de plus de 45°, s'ouvrent sous la charge des fruits. La
mise à fruit étant rapide (2°\"* - 3°\" feuille) et le bois souple, les branches s'ouvrent naturellement.
La souplesse du bois pose problème pour maintenir l'axe bien droit ; ce dernier a tendance à s'incliner ; pour
remédier à cela des essais de rabattage de l'axe dans le bois de 2 ans dès la 3°”° ou 4°”* année sont en cours.
Un palissage haut peut permettre de résoudre le problème.
La conduite de Douce de l'Avent est simple. Néanmoins il faut maintenir une bonne porosité de l'arbre par une
taille régulière.
Plantée dans un sol fertile, avec un soutien alimentaire suffisant et associé à une pratique régulière de
