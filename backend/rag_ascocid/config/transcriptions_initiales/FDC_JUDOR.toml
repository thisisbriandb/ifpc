texte_ocr = """
A la plantation, le scion a de nombreux anticipés. Quelques anticipés ouverts peuvent être conservés. La
variété ayant une tendance acrotone naturelle, la sélection de quelques anticipés bien positionnés n'empêchera
pas l'arbre de monter.
Au contraire, éviter une arcure trop violente des charpentières du bas de l'arbre (qui affaiblirait celles-ci),
l'acrotonie a déjà tendance à favoriser les branches de la partie supérieure : Sélectionner dans la partie basse
des branches ouvertes mais assez vigoureuses afin d'assurer une pérennité du bas des arbres.
Veiller cependant à arquer ou supprimer les branches dont l'angle d'insertion assez fermé ne permet pas
l'ouverture.
Par la suite, il faut gérer l'excès de vigueur qui apparaît généralement en tête de l'arbre voire arrêter l'arbre
lorsqu'il atteint une hauteur au delà de 5 m.
Dans l'ensemble, variété très facile à conduire.
ASPECT RECOLTE
petit à moyen (40 à 70g)
épiderme à fond jaune à 7 au * recouvert
d'un jaune vif strié
fin octobre à début novembre
bonne
totale à maturité £
TECHNOLOGIE
Faible Moyen Important
5-7
3.10 à 3.45
à préciser
acide
variété utilisée pour apporter de l'acidité aux cidres
Fiche réalisée avec la collaboration de l’ensemble des techniciens de la filière cidricole."""

