texte_ocr = """
Variété: BLANCHET
PRINCIPALES ZONES DE PRODUCTION
Mayenne : Evron - Sainte-Suzanne et le Sud du
département.
CARACTERISTIQUES TECHNOLOGIQUES DU FRUIT
(Moyenne des analyses effectuées
à la Station cidricole de Rennes INRA)
Poids moyen du fruit (g.): 51,2.
Rendement en jus (%) : 68,1.
Densité du jus : 1,0501.
Sucres totaux (en g. par litre): 108,3.
Acidité de titration (en g. H.SO, par litre): 3,5.
(en m.eq.): 71.
Rapport sucres/acidité : 31.
Extrait sec réduit (en g. par litre): 22,1.
Tanins (en g. par litre) : 1,28.
Couleur du jus : jaune.
Dégustation : acidulé, peu parfumé.
CARACTERISTIQUES CULTURALES DE L'ARBRE
Vigueur : moyenne.
Port : érigé puis semi-érigé.
Résistance aux maladies : sensible à la tavelure sur feuilles, aux chenilles
et aux pucerons. Hors de la Mayenne serait sensible à l'oidium et au
chancre.
Mise à fruits : lente.
Productivité : bonne avec alternance.
Saison de floraison: 3e.
Saison de maturité : 2e.
Calibre du fruit: moyen.
Conservation et transport: fruits assez délicats au transport, se meur-
trissent en silos.
OBSERVATIONS DIVERSES
Arbre se formant seul.
Sensible à l'oidium sur doucin et Malling Merton.
Variété à ne planter qu'en Mayenne.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1)
Documentation I.N.R.A. - Edition 1973 ©)"""

