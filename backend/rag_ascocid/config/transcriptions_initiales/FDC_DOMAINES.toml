texte_ocr = """
Variété: DOMAINES
PRINCIPALES ZONES DE PRODUCTION
Normandie : Pays d'Auge.
POSSIBILITES DE COMMERCIALISATION
en bonne année : 500 tonnes.
Ph Desmier de Chenon
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de MM. Tavernier et Jacquin le 30 novembre 1953)
Dégustation du jus : doux.
Dégustation du cidre : doux amer.
Rendement en jus (%) : 51,2.
Densité du jus : 1068,1 - Alcool en puissance : 8° 7.
Acidité de titration en g. SO‘H: par litre : 1,56.
Azote/sucres totaux : 0,48.
Tanin (en g. par litre) : 3,60.
Aspect du jus : assez coloré.
Parfum : assez marqué à maturité.
QUALITES CULTURALES DE L'ARBRE
Vigueur : généralement moyenne, parfois grande en sol profond.
Port : en dôme parfait. Très bel arbre.
Résistance aux maladies : assez bonne mais craint la tavelure sur les
fruits, les chenilles sur les feuilles et certaines années, les gelées
et l'anthonome sur les fleurs tardives.
Productivité : grande dans les bonnes années.
Saison de floraison : 1re.
Saison de maturité : 2°.
Conservation et transport des fruits : passables.
Calibre du fruit : moyen à gros.
OBSERVATIONS DIVERSES
Variété intéressante par la beauté de sa floraison (grandes fleurs) et
par la grosseur de ses fruits et sa bonne productivité malheureusement
un peu capricieuse.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1*+r) ©
Edition 1964"""

