La méthode de conditionnement en fût
est une : Modalité de l’étape de conditionnement et obtention de l’effervescence des cidres
est constitué de : Une désaération (facultative) | Une gazéification en saturateur | Une flash pasteurisation sous pression (facultative) | Un conditionnement en fût iso -barométrique
a pour actions complémentaires : Un sulfitage et/ou ajout d’acide ascorbique (facultatif) | Une désinfection des fûts
a pour fonctions : De produire un cidre effervescent par un apport contrôlé de CO 2 exogène | De conditionner en fût un cidre en général limpide | D’obtenir rapidement un cidre prêt à la commercialisation
a pour conséquences : De permettre une saturation précise en CO 2 | De limiter la quantité de flores indésirables en fût
présente le risque : Une oxygénation du cidre à la gazéification et à la mise en fût"""

