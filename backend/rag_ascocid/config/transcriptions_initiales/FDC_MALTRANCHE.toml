Variété: MALTRANCHE
PRINCIPALES ZONES DE PRODUCTION
(départements et cantons)
Ille-et-Vilaine : Guichen - Maure de Bretagne - Le Sel de Bretagne -
Redon - Bain de Bretagne - Pipriac - Le Grand Fougeray - Janzé - La
Guerche - Retiers.
Loire-Atlantique : St Nicolas de Redon - Guéméné Penfao - Pontchâteau
- Derval - Nozay - Rougé - Blain.
POSSIBILITES de COMMERCIALISATION en bonne année
Ille-et-Vilaine : 100 tonnes.
Loire-Atlantique : 5 000 tonnes.
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Tavernier le 25-11-53)
Dégustation du fruit : acidulé, pulpe farineuse.
Dégustation du jus : acidulé.
Rendement du jus (%) : 64,800.
Densité du jus : 1 052,2.
Acidité de titration en g. SO* H? par litre : 4,5.
Azote/Sucres totaux : 0,31.
Tanin (en g. par litre) : 1,52.
Couleur du jus : très claire.
Parfum : faible.
QUALITES CULTURALES DE L'ARBRE
Vigueur : assez grande.
Port : en dome.
Résistance aux maladies: assez rustique mais parfois tavelure sur
feuilles.
Productivité : bonne - alternante.
Saison de floraison : 2e-3e.
Saison de maturité : 2e-3e.
Conservation et transport des fruits : bons.
Grosseur du fruit : moyen.
OBSERVATIONS DIVERSES
A utiliser avant maturité complète car elle devient farineuse. Se retrouve
encore sous le nom de Dol ou de Dol Maltranche.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Poris (1*r)
Edition 1963"""

