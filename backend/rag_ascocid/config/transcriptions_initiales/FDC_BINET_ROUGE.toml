texte_ocr = """
Formation de l’arbre :
A la plantation, les anticipés sont nombreux. Lorsque certains anticipés sont conservés, veiller à les choisir bien
répartis le long de l'axe, en choisissant les plus faibles (risque de blocage ou étranglement) et en évitant les
anticipés perpendiculaires au rang (problème de passage dans le rang à terme).
Pour permettre à l'arbre de monter, il est recommandé de :
- Bien gérer, dès le départ, les branches fortes : suppression progressive des plus érigées (dont les
perpendiculaires au passage) avec possibilité d'arcure sous l'horizontale de certaines.
- Conserver en tête des branches fortes pour créer un appel de sève.
- Eviter les sur-charges des têtes qui risquent de casser ces dernières et renforcer la basitonie.
Binet Rouge a la capacité de produire sur bois de tout âge, son taux de nouaison est élevé. Il faut donc
favoriser l'éclairement de l'intérieur de l'arbre et supprimer si possible les fleurs/fruits sur l'axe qui participent au
renforcement de la basitonie (par un blocage de l'axe).
Calibre : petit à moyen 44.5 g (30 à 78g)
Forme : symétrique, aplatie ; épiderme rayé rouge
Epoque de récolte : mi à fin octobre
Particularités : vitrescence des fruits évoluant en
pourriture interne à l'approche de la récolte sur
jeunes arbres ou arbres peu chargés
Conservation au sol : moyenne
Régression de l’amidon : totale
Masse volumique (kg/m3)
Acidité (g/l H:SO:)
Rendement en jus (%) un
pH:38à4,2
Conditions d'extraction : à préciser
Saveur du moût : douce, parfumée
Cidre : peu amer, peu astringent ; caractéristiques sensorielles proches de Douce Moën
Fiche réalisée avec la collaboration de l’ensemble des techniciens de la filière cidricole."""

