texte_ocr = """
Variété: CARTIGNY
PRINCIPALES ZONES DE PRODUCTION
Normandie : Bessin et Bocage.
POSSIBILITES DE COMMERCIALISATION
en bonne année : 500 tonnes.
Ph. Desmier de Chenon
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de MM. Tavernier et Jacquin le 29 novembre 1950)
Dégustation du jus : doux.
Dégustation du cidre : doux.
Rendement en jus (%) : 60,2.
Densité du jus : 1057,2 - Alcool en puissance : 7° 3.
Acidité de titration en g. SO‘H: par litre : 1,27.
Azote/sucres totaux : 0,66.
Tanin (en g. par litre) : 2,24.
Aspect du jus : teinté.
QUALITES CULTURALES DE L'ARBRE
Vigueur : grande.
Port : en cône retombant.
Résistance aux maladies : variété résistante d'une façon générale, mais
craignant la tavelure surtout sur feuilles.
Productivité : assez grande.
Saison de floraison : 2e-3e.
Saison de maturité : 2°.
Conservation et transport des fruits : moyens.
Calibre du fruit : moyen à gros.
OBSERVATIONS DIVERSES
Cette variété produisant beaucoup, a souvent des branches trop chargées
qui cassent et sont remplacées par de nouvelles branches qui s'élèvent
trop haut. Une culture rationnelle comporterait un élagage régulier qui
éviterait les déformations et le renouvellement de la tête de l'arbre.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1*r) ©
Edition 1964"""

