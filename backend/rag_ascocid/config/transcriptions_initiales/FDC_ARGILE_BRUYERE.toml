texte_ocr = """
Variété: ARGILE BRUYÈRE
PRINCIPALES ZONES DE PRODUCTION
Normandie et Picardie : Pays de Caux - Pays de Bray -
Vimeu (Somme) et en petite quantité dans la Manche
Variété maintenant cultivée en petites formes en Seine-
Maritime.
POSSIBILITES DE COMMERCIALISATION
en bonne année : 1.000 tonnes.
Ph. Laurent
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Jacquin le 9 décembre 1964)
Dégustation du jus : doux légèrement amer, parfumé.
Dégustation du cidre : habituellement sec et parfumé.
Rendement en jus (%) : 66.
Densité du jus : 1062,3 - Alcool en puissance : 8°.
Acidité de titration en g. SO‘H: par litre : 1,51.
Azote/sucres totaux : 1,35.
Tanin (en g. par litre) : 2,16.
Aspect du jus : très coloré.
Parfum : développé.
QUALITES CULTURALES DE L'ARBRE
Vigueur : bonne.
Port : élevé.
Résistance aux maladies : satisfaisante. Les fruits sont généralement sains.
Productivité : satisfaisante sur les jeunes arbres.
Saison de floraison : 2e-3e,
Saison de maturité : 3e.
Conservation et transport des fruits : très faciles.
Grosseur du fruit: supérieure à la moyenne en particulier sur les arbres
bien cultivés.
OBSERVATIONS DIVERSES
L'aspect du fruit - liégeux avec plages dorées à maturité, légèrement
veinées de rouge - varie suivant les années, les arbres et leur exposition.
Il existe de nombreuses variétés appelées Argile qui n'ont pas les mêmes
caractéristiques et avec lesquelles il ne faut pas la confondre.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1er) @
Edition 1964"""

