Variété: CHEVALIER JAUNE
PRINCIPALES ZONES DE PRODUCTION
Côtes-du-Nord: cantons de Dinan - Evran - Caulnes -
Broons - Jugon - Lamballe - Plélan -
Plancoët - Ploubalay - Matignon - Pléneuf.
Ille-et-Vilaine : Combourg - Tinténiac.
POSSIBILITES DE COMMERCIALISATION
en bonne année : 1.000 à 1.500 tonnes.
Ph. Durand
QUALITES TECHNOLOGIQUES DU FRUIT
(moyenne des deux analyses de MM. Tavernier et Jacquin
des 14-11-1949 et 22-12-1965)
Dégustation du jus : doux amer.
Dégustation du cidre : amer doux.
Rendement en jus (%) : 62,4.
Densité du jus : 1060,6 - Alcool en puissance : 7° 75.
Acidité de titration en g. SO'H* par litre : 1,76.
Azote/sucres totaux : 0,76.
Tanin (en g. par litre) : 4,20.
Parfum : léger.
QUALITES CULTURALES DE L'ARBRE
Vigueur : bonne.
Port : dôme étalé.
Résistance aux maladies : un peu sensible à la tavelure.
Productivité : très bonne.
Alternance : peu sensible.
Saison de floraison : 3e.
Saison de maturité : 2°.
Conservation et transport des fruits : bons.
Calibre du fruit : moyen à gros.
Précocité de mise à fruits : bonne.
OBSERVATIONS DIVERSES
Mise à fruits très précoce.
Très bonne variété dans l'ensemble.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (l* (®)
Edition 196!"""

