texte_ocr = """
Variété: RAMBAULT
PRINCIPALES ZONES DE PRODUCTION
Calvados : assez abondante vers Cambremer
Pays d'Auge l Br.
POSSIBILITES de COMMERCIALISATION en bonne année
Cette variété est vendue sur les marchés comme pomme à deux fins.
De ce fait les possibilités de commercialisation comme pomme à cidre
restent imprécises.
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse du Laboratoire de Caen le 27-10-61)
Dégustation du fruit : acidulé, sucré, très bon.
Dégustation du jus : fruité, bon, assez aigre.
Rendement en jus (%) : 67.
Densité du jus : 1 059,12.
Acidité de titration en g. SO* H: par litre : 4,85.
Azote/Sucres totaux : 1,77.
Tanin (en g. par litre) : 1,08.
Couleur du jus : ambré rouge soutenu, un peu trouble.
Parfum : faible, convenable à bonne maturité.
QUALITES CULTURALES DE L'ARBRE
Vigueur : bonne.
Résistance aux maladies : assez rustique.
Productivité : assez bonne.
Saison de floraison : 3°.
Saison de maturité : 2e.
Conservation et transport des fruits : bons pour des fruits de 2e saison.
Grosseur du fruit : au-dessus de la moyenne.
OBSERVATIONS DIVERSES
Variété localisée dans la région du Pays d'Auge ; considérée autrefois
comme pomme à couteau. Certainement assez rustique dans la région
où elle se trouve.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1+r)
Edition 1963"""

