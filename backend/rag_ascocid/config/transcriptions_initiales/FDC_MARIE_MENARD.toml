texte_ocr = """
Formation de l'arbre :
A la plantation le scion est peu ramifié. La suppression de tous les anticipés est recommandée.
Les branches les plus fortes se situent comme souvent en pomme à cidre en partie basse des arbres. Les
charpentières sont souvent d'une grande section et se développent surtout en s’allongeant : privilégier les
branches sur le rang car celles orientées vers l'allée deviennent rapidement gênantes pour le passage dans les
allées.
Marie Ménard est une variété très vigoureuse mais ramifiant peu sur le tronc. La suppression d'une
charpentière créé une zone vide difficile à combler. L'arcure des branches est un outil intéressant dans ce
contexte. Par ailleurs, lors de la suppression d'une charpentière effectuer la coupe à 1-2 cm du tronc afin de
favoriser des repercements.
Cette variété est à éviter en sols trop fertiles où sa vigueur est difficilement maîtrisable.
Calibre : assez gros (50 à 90 g)
Forme : arrondi à plat de couleur verte souvent
strié de rouge (présence de rugosité)
Epoque de récolte : Première quinzaine d'octobre
Particularités : -
Conservation au sol : assez bonne
Régression de l’amidon : partielle à maturité
Masse volumique (kg/m3) | 1,061 — 1,074
sin La _ mn
pH:3,9à4,1
Conditions d'extraction : à préciser
Saveur du moût : amère
Cidre : amer et astringent (profil proche de Kermerrien et Kéramère cov)
Fiche réalisée avec la collaboration de l'ensemble des techniciens de la filière cidricole."""

