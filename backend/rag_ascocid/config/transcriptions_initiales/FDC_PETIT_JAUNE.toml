texte_ocr = """
A la plantation, le scion est souvent petit et trapu avec de nombreux anticipés. Ces derniers sont souvent trop
bas pour en conserver 4 à 5 d'où une suppression de l'ensemble des anticipés le plus souvent.
La présence de grosses branches à la base de l'arbre n'entraîne pas d'étranglement mais limite la croissance
de l'axe et empêche la pénétration de la lumière au centre de la haie.
Cette variété a un bois rigide qui malgré de fortes charges s'ouvre très lentement.
La sélection trop rapide des branches basses ou la conservation de branches fortes se traduira par des
structures qui resteront oblique : Favoriser l'ouverture des branches basses en les arquant sous l'horizontal est
recommandé.
Peu de repercement derrière les arcures ; par contre un excès de taille se traduira par des repercements à
angle fermé très vigoureux.
ASPECT RECOLTE
moyen à gros (56 à 96g)
conique à allongé (couleur de fond jaune
avec parfois une face rouge orangée)
début à mi-novembre d
moyenne à bonne eo - e
totale à maturité
TECHNOLOGIE
Faible Moyen Important
3.15 à 3.55
à préciser
jus acide et parfumé
variété utilisée pour apporter de l'acidité aux cidres
Fiche réalisée avec la collaboration de l’ensemble des techniciens de la filière cidricole."""

