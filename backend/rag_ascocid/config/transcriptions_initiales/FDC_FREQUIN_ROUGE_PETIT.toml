texte_ocr = """
Réaction à l’éclaircissage chimique : moyenne (moyenne à forte au PRM12)
Formation de l’arbre :
A la plantation, le scion est souvent peu ramifié. Les anticipés situés surtout en partie basse ont tendance à
provoquer rapidement une réduction de l'axe terminal, lorsqu'ils sont conservés. Leur suppression à la
plantation facilite la conduite par la suite.
Les charpentières ont un angle très ouvert. La conduite les premières années consiste à arquer sous
l'horizontal ou supprimer progressivement les fortes branches de la partie basse de l'arbre afin de rigidifier l'axe
en partie haute et le maintenir droit.
En sol fertile, éviter les tailles trop importantes surtout pendant la phase de jeunesse de l'arbre ; elles
vigoriseront les arbres, pénaliseront la nouaison (coulure des fleurs) et peuvent aussi favoriser le chancre.
L'axe a naturellement tendance à s'incliner : décharger le surplus de jeunes fruits sur l'axe aidera au maintien
de l'axe vertical.
Calibre : moyen à gros (50 à 60 g)
Forme : conique, très rouge avec rayures.
Epoque de récolte : début octobre
Particularités : -
Conservation au sol : moyenne (sensible aux
champignons du sol : Phytophthora, Alternaria,
Mucor)
Régression de l’amidon : très partielle à maturité
Acidité (g/l HSO:)
pH : 3,9 à 4,1
Conditions d'extraction : à préciser
Saveur du moût : douce amère, parfumée.
Cidre : amer.
Fiche réalisée avec la collaboration de l'ensemble des techniciens de la filière cidricole."""

