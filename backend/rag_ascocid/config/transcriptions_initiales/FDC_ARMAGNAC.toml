texte_ocr = """
Variété: ARMAGNAC
PRINCIPALES ZONES DE PRODUCTION
Aisne.
Seine-Maritime.
POSSIBILITES de COMMERCIALISATION en bonne année
Plantations diffuses souvent jeunes: il n'existe actuellement pas de
centres de production importants.
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Tavernier le 15-12-51)
Dégustation du jus : acide.
Rendement du jus (%) : 56,7.
Densité du jus : 1 065,5.
Acidité de titration en g. SO* H* par litre : 5,73.
Azote/Sucres totaux : 0,33.
Tanin (en g. par litre) : 1,68.
Parfum : très prononcé.
QUALITES CULTURALES DE L'ARBRE
Vigueur : assez bonne.
Port : érigé.
Résistance aux maladies : variété rustique d'une façon générale - peut
craindre les pucerons.
Productivité : assez bonne mais mise à fruits très tardive et alternante.
Saison de floraison : 1ère-2e,
Saison de maturité : 2e-3e.
Conservation et transport des fruits : très bons.
Grosseur du fruit : petit.
OBSERVATIONS DIVERSES
Très bonne variété pour l'industrie : donne un jus de haute densité et
de grande qualité. Moins bonne pour la culture à cause de ses petits
fruits et de sa mise à fruits trop tardive.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (ler)
Edition 1963"""

