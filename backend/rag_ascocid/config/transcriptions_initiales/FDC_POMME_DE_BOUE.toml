texte_ocr = """
Variété: POMME DE BOUÉ
PRINCIPALES ZONES DE PRODUCTION
(département et cantons)
Sarthe : Bonnétable - Mamers - St Cosme de Vair.
POSSIBILITES de COMMERCIALISATION en bonne année
1 000 tonnes
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Tavernier le 18-12-61)
Dégustation du fruit : acidulé, très juteux, parfumé.
Dégustation du jus : agréable, équilibré.
Rendement en jus (%) : 74,3.
Densité du jus : 1 054,2.
Acidité de titration en g. SO* H: par litre : 4,31.
Azote/Sucres totaux : 0,51.
Tanin (en g. par litre) : 1,0.
Couleur du jus : ambré.
Parfum : léger et agréable.
QUALITES CULTURALES DE L'ARBRE
Vigueur : moyenne.
Port : régulier, harmonieuse disposition des branches charpentières.
Résistance aux maladies : assez rustique malgré quelques attaques de
tavelure, d'oïdium et de chenilles.
Productivité : très grande, peu alternante.
Saison de floraison : 2e-3e.
Saison de maturité : 3e.
Conservation et transport des fruits : excellents.
Grosseur du fruit: variable suivant la production, en général moyen ou
au-dessous de la moyenne.
OBSERVATIONS DIVERSES
Mise à fruit rapide. Les fruits tiennent bien à l'arbre jusqu'à complète
maturité.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1+r)
Edition 1963"""

