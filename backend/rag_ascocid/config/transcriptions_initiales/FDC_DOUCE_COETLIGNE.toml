texte_ocr = """
faible à moyenne (moyenne à forte au PRM12) selon la vigueur et la
charge.
A la plantation, le scion a souvent de nombreux anticipés vigoureux. 3 à 5 anticipés bien répartis le long du
tronc peuvent être conservés. En l'absence de ce type d'anticipés, il est préférable de tous les supprimer.
En effet, les anticipés même ouverts au départ, ont tendance à se renforcer par la suite.
Les premières années, dès qu'un étranglement est pressenti, la suppression progressive des quelques
ramifications les plus concurrentes est nécessaire afin de faire monter l'arbre. Une arcure sous l'horizontale des
autres dominantes, bien positionnées, est possible, en les vrillant par exemple.
Les gourmands fréquents doivent être supprimés surtout lorsqu'ils se situent à la base des branches, près du
tronc. Vers l'extrémité de la branche, leur conservation contribue à augmenter la ramification. lIs peuvent être
inclinés en les vrillant s'ils sont trop vigoureux. De même, les « pattes d'oie » en bout de branches peuvent être
conservées. Une augmentation de la ramification à l'extrémité de la branche favorisera une ouverture de celle-ci
(charge de fruits plus élevée).
ASPECT RECOLTE
moyen à gros (50 à 70g)
fruit aplati à épiderme de couleur jaune avec
souvent présence de rugosité.
début à mi octobre 4
Le potentiel de grossissement des
fruits est élevé (90 à 100 g).
bonne conservation des fruits
au sol.
totale le plus souvent. .
