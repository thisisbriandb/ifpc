Variété: JUDIN
PRINCIPALES ZONES DE PRODUCTION
(départements et cantons)
Ille-et-Vilaine : Guichen - Maure de Bretagne - Le Sel de Bretagne -
Redon - Bain de Bretagne - Pipriac - Le Grand Fougeray.
Loire-Atlantique : Derval - Guémené Penfao - St Nicolas de Redon.
POSSIBILITES de COMMERCIALISATION en bonne année
100 tonnes
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Tavernier le 16-11-53)
Dégustation du fruit : acide, dur, peu juteux.
Dégustation du jus : acide, bien sucré.
Rendement en jus (%) : 61,600.
Densité du jus : 1067,6.
Acidité de titration en g. SO* H: par litre : 6,12.
Azote/Sucres totaux : 0,54.
Tanin (en g. par litre) : 1,20.
Couleur du jus : clair.
Parfum : très prononcé
QUALITES CULTURALES DE L'ARBRE
Vigueur : bonne.
Port : branches longues, peu garnies.
Résistance aux maladies : bonne rusticité - ne craint pas l'humidité.
Productivité : bonne et assez régulière dans sa zone de production.
Saison de floraison : 3e.
Saison de maturité : 3e.
Conservation et transport des fruits : très bons.
Grosseur du fruit : moyen ou assez gros.
OBSERVATIONS DIVERSES
Variété très intéressante pour l'industrie (jus et confitures) et pour la
culture. À essayer en dehors de sa région de production.
Comité des Fruits à Cidre et des Productions Cidriccles - 42, rue du Louvre - Paris (1er)
Edition 1963"""

