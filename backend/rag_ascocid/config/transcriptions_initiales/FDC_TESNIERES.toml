Parfum : assez prononcé.
QUALITES CULTURALES DE L'ARBRE
Vigueur : moyenne.
Résistance aux maladies : rustique d'une manière générale.
Productivité : très bonne.
Saison de floraison : 2e-3e.
Saison de maturité : 2e.
Conservation et transport des fruits : bons.
Grosseur du fruit : au-dessus de la moyenne.
OBSERVATIONS DIVERSES
