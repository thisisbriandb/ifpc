texte_ocr = """
Variété: RENAO
PRINCIPALES ZONES DE PRODUCTION
Originaire de Loire-Atlantique, cette variété s'est bien comportée
partout où elle a été introduite, en Normandie comme en Bretagne.
POSSIBILITES DE COMMERCIALISATION
Plantations jeunes et diffuses. Il n'existe pas de centres de production.
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Jacquin du 5 janvier 1965)
Dégustation du jus : aigre.
Rendement en jus (%) : 73,3.
Densité du jus : 1061 - Alcool en puissance : 7° 9,
Acidité de titration en g. SO*H: par litre : 10,82.
Azote/sucres totaux : 1,16.
Tanin (en g. par litre) : 1,20.
Parfum : léger.
QUALITES CULTURALES DE L'ARBRE
Vigueur : grande.
Port : en cône renversé, retombant extérieurement.
Résistance aux maladies : bonne.
Alternance : très faible.
Productivité : forte.
Saison de floraison : 3e-4e.
Saison de maturité : 2°.
Conservation et transport des fruits : bons.
Calibre du fruit : moyen.
Mise à fruits : assez précoce sur porte-greffes de multiplication végétative.
OBSERVATIONS DIVERSES
Variété produisant un jus à acidité très élevé et à très bonne densité.
La végétation se poursuit tardivement en saison.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1+r)
u Edition 1966 (@&)"""

