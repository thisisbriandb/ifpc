Variété: MUSCADET DE DIEPPE
PRINCIPALES ZONES DE PRODUCTION
Seine-Maritime : Pays de Caux et Vallée de la Seine
POSSIBILITES DE COMMERCIALISATION
en bonne année : 3.000 tonnes.
Ph. Lourent
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de MM. Tavernier et Jacquin du 5 novembre 1951)
Dégustation du jus : doux.
Dégustation du cidre : doux amer.
Rendement en jus (%) : 53,5.
Densité du jus : 1057,4 - Alcool en puissance : 7° 4,
Acidité de titration en g. SO*H: par litre : 2,00.
Azote/sucres totaux : 0,50.
Tanin (en g. par litre) : 2,56.
Parfum : faible.
QUALITES CULTURALES DE L'ARBRE
Vigueur : grande.
Port : en parapluie.
Résistance aux maladies : bonne.
Alternance : régulière tous les deux ans.
Productivité : élevée.
Saison de floraison : 1re.
Saison de maturité : 1e.
Conservation et transport des fruits : très moyens.
Calibre du fruit : gros.
Mise à fruits : très tardive.
OBSERVATIONS DIVERSES
Variété donnant des cidres se conservant naturellement doux. Très ap-
préciée au point de vue technologique, elle présente le grave inconvé-
nient d'une mise à fruits tardive même en formes basses. Tavelure
sur fruits assez fréquente dans les vergers non traités en dehors de la
Seine-Maritime.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1er) @
Edition 1966"""

