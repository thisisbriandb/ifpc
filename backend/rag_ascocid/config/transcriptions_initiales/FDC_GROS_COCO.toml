texte_ocr = """
Variété: GROS COCO
PRINCIPALES ZONES DE PRODUCTION
(département et cantons)
Loire-Atlantique : Moisdon la Rivière - Issé - Châteaubriant - Rougé -
Nozay - Derval.
POSSIBILITES de COMMERCIALISATION en bonne année
4 000 tonnes
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Tavernier le 10-11-53)
Dégustation du fruit : bien acidulé.
Dégustation du jus : bien acidulé, légère âpreté.
Rendement en jus (4) : 60,6.
Densité du jus : 1 056,6.
Acidité de titration en g. SO* H? par litre : 4,90.
Azote/Sucres totaux : 0,23.
Tanin (en g. par litre) : 2,56.
Couleur du jus : jaune marqué.
QUALITES CULTURALES DE L'ARBRE
Vigueur : grande.
Port : érigé et buissonnant.
Résistance aux maladies : rustique - parfois un peu de tavelure.
Productivité : très grande, avec alternance faiblement marquée.
Saison de floraison : 3e.
Saison de maturité : 2e-3e.
Conservation et transport des fruits : très bons.
Grosseur du fruit : très variable suivant la charge de l'arbre et selon les
secteurs où l'appellation du « gros Coco » devient « Coco » (Lusanger).
OBSERVATIONS DIVERSES
Variété très productive. Doit être élaguée tous les 5 ans et recevoir une
bonne fumure si l'on veut des fruits suffisamment gros.
2
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1er)
Edition 1963"""

