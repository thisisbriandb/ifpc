Figure 1 : Le noyau benzénique, le groupe phénol et l'oxydation des composés
phénoliques.
Le noyau benzénique est une molécule cyclique de 6 carbones et 6 hydrogènes, qui peut être
schématisée de différentes façons (a) ; les hydrogènes n'étant généralement pas représentés.
Lorsqu'un des hydrogènes est remplacé par un OH, on forme un groupe phénol (b) ou un diphénol,
s’il y a deux OH. Si les deux OH sont sur des carbones voisins (c), il sera appelé un ortho-diphénol.
Ces groupes phénols peuvent être oxydés en présence d'oxygène pour donner une ortho-quinone à
partir d’un ortho-diphénol (e). Les mono-phénols sont d’abord oxydés en ortho-diphénol, puis en
ortho-quinone (d)."""

