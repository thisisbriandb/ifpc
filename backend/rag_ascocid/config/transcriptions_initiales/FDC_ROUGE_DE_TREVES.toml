Variété: ROUGE DE TRÊVES
PRINCIPALES ZONES DE PRODUCTION
Ille-et-Villaine.
Orne.
Maine-et-Loire.
Ardennes.
Seine-et-Marne.
Loire-Atlantique.
POSSIBILITES de COMMERCIALISATION en bonne année
Variété trop dispersée pour pouvoir constituer des lots importants dans
un lieu donné.
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Tavernier le 9-11-61)
Dégustation du fruit : juteux, bien acidulé.
Dégustation du jus : trop aigre, manque de sucre.
Rendement en jus (%) : 69,1.
Densité du jus : 1 043,5.
Acidité de titration en g. SO* H° par litre : 5,63.
Azote/Sucres totaux : 0,35.
Tanin (en g. par litre) : 1,16.
Parfum : assez prononcé.
QUALITES CULTURALES DE L'ARBRE
Vigueur : assez bonne.
Port : érigé - bois cassant.
Résistance aux maladies : sensible ou très sensible à la tavelure sur feuil-
les, rameaux et fruits - sensible à l'oidium sur rameaux.
Productivité : moyenne et alternante.
Saison de floraison : 2e.
Saison de maturité : 2e-3e.
Conservation et transport des fruits : bons.
Grosseur du fruit : moyen ou au-dessous de la moyenne.
OBSERVATIONS DIVERSES
Variété souvent plantée le long des routes au début du siècle surtout
dans l'Est mais qui disparait avec l'élargissement des routes. Variété
excellente pour les compotes, les confitures, les pâtisseries et naturelle-
ment les jus. On la retrouve un peu partout mais très disséminée et en
voie de disparition. Elle serait à traiter comme une pomme à couteau.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1er)
Edition 1963"""

