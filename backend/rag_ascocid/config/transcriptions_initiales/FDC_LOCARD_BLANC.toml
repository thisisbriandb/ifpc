Parfum : léger.
QUALITES CULTURALES DE L'ARBRE
Vigueur : grande.
Port : en dome, étalé.
Résistance aux maladies : sensible à la tavelure sur feuilles.
Productivité : bonne à très bonne mais alternante.
Saison de floraison : 2e-3e.
Saison de maturité : 22-3e.
Conservation et transport des fruits : faibles.
Grosseur du fruit : moyen à gros.
