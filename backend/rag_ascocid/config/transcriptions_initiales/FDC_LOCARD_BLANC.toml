Loire-Atlantique : Blain - Derval - Nozay.
POSSIBILITES de COMMERCIALISATION en bonne année
Sarthe : 1 500 tonnes.
Ille-et-Vilaine : 5 tonnes.
Loire-Atlantique : tonnage insignifiant.
QUALITES TECHNOLOGIQUES DU FRUIT
Dégustation du fruit : acidulé.
