texte_ocr = """
A la plantation, le scion a de nombreux anticipés plus ou moins pleureurs. Quelques anticipés, ouverts peuvent
être conservés.
La souplesse du bois impose un palissage haut (3m) afin de maintenir l'axe droit.
Les repercements nombreux nécessitent de bien gérer la pénétration de la lumière dans l'arbre :
- Créer des trous de lumière en éliminant les branches dont l'angle d'insertion est fermé.
- Supprimer les branches de la partie haute qui deviennent trop forte et ainsi éviter un dégarnissement du
bas de l'arbre
Hormis ce problème de lumière, Avrolles est une variété dont la conduite est assez facile dès lors que la
vigueur n'est pas exacerbée: son port est naturellement pleureur.
ASPECT RECOLTE
petit à moyen (41 à 70 g)
globuleux, rayé et lavé de rouge
mi-novembre
bonne conservation
totale.
TECHNOLOGIE
Faible Moyen Important
3,1 à 3,3
à préciser
peu parfumé, très acide
apporte de l'acidité aux cidres (variété de base pour la production de cidre traditionnel dans sa zone
d'origine le Pays d'Othe - Aube)
Fiche réalisée avec la collaboration de l’ensemble des techniciens de la filière cidricole."""

