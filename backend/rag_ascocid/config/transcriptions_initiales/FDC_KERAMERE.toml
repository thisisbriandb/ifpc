texte_ocr = """
Formation de l'arbre :
A la plantation, les scions sont très peu ramifiés : il est préférable de supprimer les quelques rares anticipés car
ils risquent de devenir dominants et rester érigés.
Les premières années, la conduite est simple : tailler les branches trop basses et arquer éventuellement dans la
partie supérieure celles qui ne s'arquent pas d'elle-même.
Les branches sont naturellement dégarnies dans leur tiers supérieur permettant une bonne porosité de l'arbre.
Quelques gourmands apparaissant sur les arcures des branches peuvent être vrillés ou supprimés.
Les ramifications sont naturellement souples. Il en est de même pour l'axe d'où une tendance de ce dernier à
fortement s'incliner sous le poids des fruits : des essais de rabattage de l'axe sont en cours mais un palissage
haut peut aussi être une solution adaptée.
Plantée dans un sol assez fertile, avec un soutien alimentaire suffisant et associé à une pratique régulière de
l'éclaircissage (quel que soit le moyen utilisé), cette variété a des atouts intéressants.
Calibre : moyen (50 à 80g)
Forme : arrondi à conique (bicolore)
Epoque de récolte : mi à fin octobre
Particularités : -
Conservation au sol : moyenne à bonne
Régression de l’amidon : pas d'information
ts Donne lt ___ em)
PH : 3,7 à 3.9
Conditions d'extraction : à préciser
Saveur du moût : amère
Cidre : peu sucré, amer et astringent (proche de Marie Ménard et Kermerrien)
Fiche réalisée avec la collaboration de l’ensemble des techniciens de la filière cidricole."""

