texte_ocr = """
A la plantation, le scion a souvent peu d'anticipés qu'il est préférable de supprimer.
En effet, les anticipés même ouverts au départ, ont tendance à se renforcer par la suite et peuvent donner des
axes secondaires.
La conduite est assez facile ; elle consiste avant tout à maîtriser les ramifications les plus vigoureuses soit par
leur élimination soit en les arquant.
Par la suite, la charge de fruits va contribuer à l'ouverture des autres ramifications. Très caractéristique de cette
variété, les branches s'ouvrent en faisant la « manivelle » (même observation sur la variété Bisquet). Si
certaines branches ne basculent pas sous l'horizontal, il est possible de les incliner en les vrillant en été.
De nombreux repercements vigoureux ont tendance à apparaître derrière des torsions ou arcure de branches :
leur arrachage en été de préférence est indispensable surtout dans le centre de l'arbre.
