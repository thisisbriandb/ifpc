Variété: CAZO JAUNE
PRINCIPALES ZONES DE PRODUCTION
(départements et cantons)
Côtes-du-Nord : Loudéac - Mur de Bretagne - Corlay - Uzel - St Nicolas
du Pélem.
Morbihan : Tout le département mais pas de secteur bien défini.
POSSIBILITES de COMMERCIALISATION en bonne année
1 000 tonnes
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Tavernier le 4-12-50)
Dégustation du fruit : acide-amer.
Dégustation du jus : acide-amer.
Rendement en jus (%) : 63,3.
Densité du jus : 1 055,0.
Acidité de titration en g. SO‘ H: par litre : 8,47.
Azote/Sucres totaux : 0,38.
Tanin (en g. par litre) : 3,40.
Couleur du jus : jaune paille.
QUALITES CULTURALES DE L'ARBRE
Vigueur : moyenne.
Port : assez érigé.
Résistance aux maladies : bonne d'une façon générale.
Productivité : bonne.
Saison de floraison : 3e-4e,
Saison de maturité : 2e.
Conservation et transport des fruits : assez bons.
Grosseur du fruit: moyen et assez gros sauf pour les variétés virosées.
OBSERVATIONS DIVERSES
Variété critiquée à cause de son amertume mais très intéressante pour
son acidité et ses qualités culturales. Néanmoins il convient de faire
attention à l'origine des souches (beaucoup sont virosées et donnent des
fruits plus petits, plus amers et de maturité incomplète). Une sélection
clonale est en cours.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1*r)
Edition 1963"""

