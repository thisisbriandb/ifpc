texte_ocr = """
Rouge de Ruiz
Clone : X4876
Obtention Inrae, site d'Angers, pommier à chair rouge destiné à l'élaboration de
cidre rosé. Editée par CEP Innovation.
1. L'arbre
Vigueur : moyenne
Port : très souple, retombant, palissage fortement recommandé
Floraison : précoce en même temps que les pommes à jus type
Judeline (les « 3J »), 10 jours après Golden, 20-25 avril à Sées
Alternance : variété régulière
Production : donnée non disponible
2. Conception du verger
Variétés pollinisatrices : Judeline, Judaine, Amanda, Shamrock,
Douce de l’Aventcov
Porte-greffe recommandé : M116, à adapter selon sol et mode de
conduite
Sensibilité aux maladies : variété rustique (pas de sensibilité
aux maladies tavelure, oïdium, chancre) ; des monilioses peuvent
être observées en cas d’amas de fruits
Etre vigilant sur les symptômes éventuels de feu bactérien
Réaction à l’éclaircissage chimique : donnée non disponible
3. Le fruit
3.1 Récolte
Calibre : gros (environ 80g)
Forme : globuleuse
Epoque de récolte : fin septembre, 10 jours après Golden,
environ une semaine après Kermerrien, vers le 25 septembre à
Sées.
Conservation au sol : donnée non disponible attention, les
variétés à chair rouge peuvent perdre leur potentiel colorant
avec l'avancée de la maturité
Couleur de la chair : rouge sombre
3.2 Technologie
Stabilité de la couleur du jus : stable en condition d’oxydation forcée
Masse volumique : moyenne 1048-1052 kg/m°
pH : environ 3.2-3.3 ; acidité totale :8 g/l exprimé en H2SO4
Fiche élaborée par l'Inrae, l'IFPC et CEP Innovation Version du 18/05/21"""

