texte_ocr = """
Variété: MARIN ONFROY
PRINCIPALES ZONES DE PRODUCTION
Centre de la Manche.
POSSIBILITES DE COMMERCIALISATION
en bonne année : 100 tonnes.
Ph. Desmier de Chenon
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de M. Jacquin du 1e\" décembre 1965)
Dégustation du jus : doux amer.
Densité du jus : 1051 - Alcool en puissance : 6° 5.
Acidité de titration en g. SO‘H: par litre : 2,64.
Azote/sucres totaux : 3,46.
Tanin (en g. par litre) : 1,80.
Parfum : faible.
QUALITES CULTURALES DE L'ARBRE
Vigueur : très grande.
Port : arbre en cylindre.
Résistance aux maladies : sensible à l'anthonome et à la tavelure qui par
la suite peut causer des chancres.
Alternance : très marquée.
Productivité : faible.
Saison de floraison : 2e.
Saison de maturité : 3e.
Conservation et transport des fruits : assez bons.
Calibre du fruit : gros.
Mise à fruits : tardive sur franc.
OBSERVATIONS DIVERSES
La floraison s'annonce abondante (nombreux boutons) mais peu de fleurs
arrivent à éclosion du fait de l'anthonome.
Arbre très important et très beau.
Très beaux fruits, estimés en cidrerie.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1-'})
Edition 1966 [G)"""

