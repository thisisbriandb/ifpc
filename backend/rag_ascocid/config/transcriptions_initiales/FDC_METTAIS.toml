Variété: METTAIS
PRINCIPALES ZONES DE PRODUCTION
Eure - Seine-Maritime - Pays d'Auge - Vimeu (Somme).
POSSIBILITES DE COMMERCIALISATION
en bonne année : 10.000 tonnes.
Ph. Desmier de Chenon
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de MM. Tavernier et Jacquin le 21 novembre 1949)
Dégustation du jus : doux.
Dégustation du cidre : doux amer.
Rendement en jus (%) : 50.
Densité du jus : 1069,0 - Alcool en puissance : 8° 9.
Acidité de titration en g. SO‘H: par litre : 0,95.
Azote/sucres totaux : 0,49.
Tanin (en g. par litre) : 4,52.
Aspect du jus : bien coloré.
Parfum : agréable.
QUALITES CULTURALES DE L'ARBRE
Vigueur : grande.
Port : en cône renversé retombant extérieurement.
Résistance aux maladies : les feuilles sont un peu sensibles à la tavelure
et aux chenilles.
Productivité : bonne.
Alternance : faible en terrain riche.
Saison de floraison : 1re-2e,
Saison de maturité : 2e.
Conservation et transport des fruits : bons.
Grosseur du fruit : faible à moyenne.
OBSERVATIONS DIVERSES
Arbre exigeant, demandant des fumures régulières. Produisant des pous-
ses nombreuses et fines, il nécessite des élagages périodiques. Mise à
fruit précoce. Apprécié pour ses qualités cidrières.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1er) ©
Edition 1964"""

