IFPC > FREQUINETTE cov
Clone indemne : X5128
| NA Co-obtention : IFPC et INRA
Exclusivité de multiplication aux adhérents CEP Innovation
SCIENCE & IMPACT Parents : Fréquin Rouge Petit x X3189
Variété amère à maturité mi novembre, de productivité moyenne compte-tenu notamment de sa montée en
production faible les premières années.
Son intérêt réside avant tout dans ses qualités technologiques (riche en sucres et en tanins) et sa période de
maturité. Le panel variétal des variétés amères est pauvre courant novembre.
Bois trapu, nécessitant une arcure pendant la phase de formation de l'arbre ; Eviter les sols trop fertiles, les
fortes tailles, privilégier l’arcure car la variété a une nouaison difficile (la mettre en conditions de pollinisation
optimum).
La culture de Fréquinette est délicate les premières années dans les secteurs sensibles au chancre.
[Fab | Moyen | Fon |
Insertion des branches : semi-ouvert Photo : architecture de l'arbre en forme libre
ÉTÉÉE ES
Faible Moyen Fort
Floraison : Fin avril — début mai D |
Particularités : variété triploïde __ |
Production : 20 - 30 tonnes/ha
Variétés pollinisatrices : Baugène, Bauflor (essais en cours)
Porte-greffe/ densité de plantation : 5.5 m X 2.5 m soit une densité réelle d'environ 650 arbres par hectare
sur MM106, à moduler selon le sol et le mode de conduite.
Sensibilité aux maladies : Tavelure : faible à moyenne. Oïdium : faible. Chancre : moyenne à forte. Feu
bactérien : forte attaque observée sur un arbre à l'INRA (49)"""

