texte_ocr = """
La clarification haute classique
est une : Modalité de l’étape de clarification des moûts
a pour synonymes : La défécation | La clarification par le haut
est constituée de : La déméthylation des pectines | La gélification des pectines | La flottation du chapeau brun | Le soutirage du moût clarifié
a pour fonction : L’élimination du trouble
a pour conséquences : De faciliter les opérations de séparation ultérieures | De baisser la vitesse de fermentation | D’accroitre la croissance des levures Hanseniaspora
est fiabilisée par : L’ajout de pectinestérase | L’ajout de sels de calcium | La maitrise de la température
a pour causes d’échec : Une trop faible quantité de pectines solubles du moût | Une dégradation de la pectine | Une acidité trop élevée du moût (variétés acides) | Une mauvaise remontée du chapeau brun | Un soutirage trop tardif | Des pratiques inadéquates (stockage PE, Ca) | Des températures extrêmes du moût (basses ou élevées) | Un ajout important de SO2 (empêche la flottation)"""

