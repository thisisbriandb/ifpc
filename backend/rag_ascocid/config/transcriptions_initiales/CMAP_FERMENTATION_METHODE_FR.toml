texte_ocr = """
La méthode FR (fermentation ralentie)
est une : Modalité de l’étape fermentaire
a pour synonyme : La méthode de fermentation par réduction de biomasse
est constituée de : Une mise en fermentation | Une fermentation primaire | Une réduction de la quantité de levures | Une fermentation secondaire | Une élimination des levures (facultative)
a pour fonctions : De transformer des moûts en cidres à assembler | D’échelonner les embouteillages par une diversité de vitesses de fermentation | De fermenter lentement jusqu’à la masse volumique souhaitée à l’assemblage | De maintenir une production de CO 2 pour éviter l’oxygénation des cidres | De réduire les capacités frigorifiques nécessaires en cuverie
a pour conséquences : Une limitation des levures à voile (flores d’altération aérobies) | Une croissance éventuelle des et Brettanomyces Oenococcus
est influencée par : La température de la cuverie | L’évolution de la population de levures vivantes (fermentation 2 re)
s’appuie sur a pour incidents : Un suivi fermentaire | Une recroissance excessive des levures | Un blocage de fermentation (fermentation 2 re) | Une croissance de flores d’altération"""

