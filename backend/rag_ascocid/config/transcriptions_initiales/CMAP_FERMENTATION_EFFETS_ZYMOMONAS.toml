texte_ocr = """
Les principaux effets des : Zymomonas le framboisé
sont des : Phénomènes se produisant principalement au cours de l’étape fermentaire
regroupent : Une production d’éthanal | Une fermentation particulière du glucose en éthanol + CO 2
sont conditionnés par : Le développement des Zymomonas
ont pour autres conséquences : Une forte production de CO2 en cas de framboisé en cuve | L’apparition d’une mousse blanche persistante | Un risque de sur -pression en cas de framboisé en bouteille | Un dépassement de la limite légale en éthanal autorisée (100 mg/L)
ont pour impacts sensoriels : Une baisse rapide de la saveur sucrée | L’apparition d’une odeur spécifique du framboisé (végétal/vert, tige coupée…) | La formation d’un trouble (précipitation des polyphénols avec l’éthanal)
dépendent de : Leur population maximale atteinte | Leur survie dans le milieu (pH, SO 2)"""

