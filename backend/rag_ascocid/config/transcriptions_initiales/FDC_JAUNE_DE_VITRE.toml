texte_ocr = """
Variété: JAUNE DE VITRÉ
PRINCIPALES ZONES DE PRODUCTION
(département et cantons)
Ille-et-Vilaine : St Aubin du Cormier - Sud de Fougères - Liffré - Rennes
Nord - Châteaubourg - Châteaugiron - Janzé - Vitré - Argentré du Plessis
- La Guerche - Retiers.
POSSIBILITES de COMMERCIALISATION en bonne année
500 tonnes
QUALITES TECHNOLOGIQUES DU FRUIT |
(analyse de M. Tavernier le 12-1-53) |
Dégustation du fruit : acidulé.
Dégustation du jus : acidulé.
Rendement en jus (%) : 51,5. |
Densité du jus : 1 069,8. |
Acidité de titration en g. SO‘ H: par litre : 5,28.
Azote/Sucres totaux : 0,52.
Tanin (en g. par litre) : 1,80.
Couleur du jus : pâle peu coloré.
Parfum : bon.
QUALITES CULTURALES DE L'ARBRE |
Vigueur : moyenne.
Port : semi-érigé au départ.
Résistance aux maladies : assez sensible à l'oidium, et à ia tavelure. |
Productivité : assez bonne mais alternante. { |
Saison de floraison : 3e-4e.
Saison de maturité : 2e-3e.
Conservation et transport des fruits : bons en général.
Grosseur du fruit : moyen.
OBSERVATIONS DIVERSES
Excellente variété pour des usages nombreux (jus, cidre, gelée, pâtis-
serie, etc.) mais de rusticité assez faible en culture. Bien élaguée et
surtout bien fumée, elle serait bien moins alternante.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (ler)
Edition 1963"""

