texte_ocr = """
Variété: LOCARD VERT
PRINCIPALES ZONES DE PRODUCTION
Sarthe : Sillé-le-Guillaume - Loué - Brulon - Marolles.
Ille-et-Vilaine : Région centrale et Pays de Redon - La
Guerche - Retiers.
Loire-Atlantique : St-Nicolas-de-Redon - Derval - Rougé
- Châteaubriant - Guéméné Penfao - Nozay - Blain.
CARACTERISTIQUES TECHNOLOGIQUES DU FRUIT
(Moyenne des analyses effectuées
à la Station cidricole de Rennes INRA)
Poids moyen du fruit (g.): 137.
Rendement en jus (%): 76,1.
Densité du jus : 1,0547.
Sucres totaux (en g. par litre): 119,3.
Acidité de titration (en g. H,SO, par litre) : 4,0
(en m.eq.) : 81.
Rapport sucres/acidité : 29,8.
Extrait sec réduit (en g. par litre): 22,5.
Tanins (en g. par litre): 1,3.
Couleur du jus : ambré.
Dégustation : acidulé, peu parfumé.
CARACTERISTIQUES CULTURALES DE L'ARBRE
Vigueur : grande.
Port : en dôme semi-étalé.
Résistance aux maladies : sensible à la tavelure des feuilles, quelquefois
des fruits.
Mise à fruits : assez rapide.
Productivité : bonne à très bonne peu alternante.
Saison de floraison: 3e.
Saison de maturité : 2e.
Calibre du fruit: assez gros.
Conservation et transport des fruits : bons.
OBSERVATIONS DIVERSES
Variété intéressante s'adaptant bien en différentes régions.
L'arbre se forme avec peu de taille.
Le nom de Locard vert correspond à de nombreuses formes voisines,
plus ou moins vertes, jaunes et quelquefois lavées de rose et plus ou
moins grosses. Locard et petit Locard sont probablement des Locard
vert. De gros fruits dits gros Locard s'altèrent rapidement.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1*)
Documentation I.N.R.A. - Edition 1973"""

