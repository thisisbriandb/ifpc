texte_ocr = """
A la plantation, certains anticipés sélectionnés peuvent être conservés.
Les ramifications ont des angles assez fermés mais qui s'ouvrent sous la charge des fruits. La fructification
principalement à l'extrémité des branches (brindilles couronnées), la mise à fruits rapide et la souplesse du bois
permettent une ouverture naturelle des branches.
Les premières années, des pincements en végétation ou un rabattage dans le bois de 2 ans en hiver
permettent de rigidifier l'axe. La gestion de la charge de fruits de la partie supérieure des arbres facilitera aussi
le renforcement de l'axe.
La conduite de Judeline® en axe est simple. Néanmoins il faut maintenir une bonne porosité de l'arbre par une
taille régulière.
Sa tendance acrotone nécessite une conduite adaptée :
- Maintenir des structures fortes en partie basse de l'arbre
- Gérer le développement de ramifications en partie haute par la suppression de structures trop
importantes afin de maintenir un bon éclairement du bas de l'arbre
ASPECT RECOLTE
assez gros (80 à 120g)
épiderme à fond jaune strié de rouge
orangé sur la moitié de la surface.
mi-octobre
secouage mécanique difficile avant
chute naturelle (fruits en extrémité de branches et
long pédoncule) — tendance des fruits à murir sur
l'arbre
moyenne à mauvaise (fruit
fragile)
totale à maturité Es
TECHNOLOGIE
Faible Moyen Important
3.4 à 3.6
à préciser
légèrement acidulée
variété utilisée pour apporter de l'acidité aux cidres
