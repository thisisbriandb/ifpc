Variété: DOUX EVÊQUE JAUNE
PRINCIPALES ZONES DE PRODUCTION
Côtes-du-Nord: cantons de Lamballe, Collinée, Jugon
Moncontour, Pléneuf, Matignon.
POSSIBILITES DE COMMERCIALISATION
en bonne année : 1.000 tonnes.
Ph. Durand
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse de MM. Tavernier et Jacquin le 25 octobre 1950)
Dégustation du jus : doux.
Dégustation du cidre : doux amer.
Rendement en jus (%) : 63.
Densité du jus : 1058,6 - Alcool en puissance : 7° 5.
Acidité de titration en g. SO‘H® par litre : 1,12.
Azote/sucres totaux : 0,59.
Tanin (en g. par litre) : 2,64.
Aspect du jus : assez clair.
Parfum : bon et assez prononcé.
QUALITES CULTURALES DE L'ARBRE
Vigueur : grande.
Port : en dôme retombant.
Résistance aux maladies : bonne, légèrement sensible à la tavelure sur
feuilles et aux pucerons.
Productivité : grande.
Alternance : plutôt faible.
Saison de floraison : 3e.
Saison de maturité : 2e.
Conservation et transport des fruits: mauvais, doivent être traités sur
place.
Grosseur du fruit : moyenne.
OBSERVATIONS DIVERSES
Remarquable par son développement dès le jeune âge.
