texte_ocr = """
Procédures de Nettoyage & Désinfection du matériel
sont un : Ensemble de procédures d'hygiène spécifiques à un matériel
regroupent : Un rinçage du produit résiduel | Un nettoyage mécanique et chimique (élimination des dépôts et encrassements) | Un rinçage intermédiaire | Une désinfection (destruction des levures, bactéries et moisissures) | Un éventuel maintien en conditions bactériostatiques | Un rinçage final avant réutilisation
ont pour fonction : D’établir des méthodes pour maintenir le matériel à un bon niveau d’hygiène
sont fondées sur : Une élimination des nutriments de croissance | Une dissolution (chimique) des encrassements qui maintiennent des foyers de contamination | Une destruction des microorganismes résiduels | Une élimination des résidus chimiques
sont définies par : Une suite d'opérations adaptées au matériel | Des conditions de mise en œuvre de ces opérations (température, durée, concentration des produits...) | Une fréquence de mise en œuvre
ont pour points de vigilance : Les volumes morts (vannes, dégustateurs, by-pass, jauges...)"""

