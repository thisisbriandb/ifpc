texte_ocr = """
Formation de l'arbre :
A la plantation, les anticipés sont nombreux. Lorsque certains anticipés sont conservés, veiller à bien les
« étager » en choisissant les plus faibles (risque de blocage ou étranglement) et en évitant les anticipés
perpendiculaires au rang (problème de passage dans le rang à terme).
Pour permettre à l'arbre de monter, il est recommandé de :
- Bien gérer, dès le départ, les branches fortes : suppression progressive des plus érigées (dont les
perpendiculaires au passage) avec possibilité d'arcure sous l'horizontale de certaines. L'arcure est
particulièrement intéressante pour cette variété à faible repercement !
-__ Conserver en tête des branches fortes pour créer un appel de sève.
-_ Eviter les sur-charges des têtes qui risquent de casser ces dernières et renforcer la basitonie.
Lorsque l'arbre a été bien formé les premières années, la conduite en verger adulte ne nécessite plus une taille
chaque année : peu de charpentières et peu de repercements !
Pour faciliter les repercements sur le tronc, lors de suppression de branches, effectuer des coupes à1-2cm du
tronc.
Calibre : petit à moyen 44.5 g (30 à 78g)
Forme : aplatie, épiderme jaune à maturité avec
parfois une joue orangée
Epoque de récolte : mi-novembre
Particularités :
Conservation au sol : bonne
Régression de l'amidon : totale
(me | mom men |
Acidité (g/l H,S0:)
Rendement en jus (%) Eu
PH : 4,02 à 4,25
Conditions d'extraction : à préciser
Saveur du moût : douce à douce amère
Cidre : parfumé (arôme particuliers de clou de girofle)
Fiche réalisée avec la collaboration de l'ensemble des techniciens de la filière cidricole."""

