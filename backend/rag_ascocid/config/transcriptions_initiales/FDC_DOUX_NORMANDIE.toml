Variété: DOUX NORMANDIE
PRINCIPALES ZONES DE PRODUCTION
Maine - Perche - Eure.
POSSIBILITES DE COMMERCIALISATION
en bonne année : 8.000 tonnes.
Ph. Hersemeule
QUALITES TECHNOLOGIQUES DU FRUIT
(moyenne de deux analyses de MM. Tavernier et Jacquin
des 22-1-1951 et 20-12-1965)
Dégustation du jus : doux à doux amer.
Dégustation du cidre : doux.
Rendement en jus (%) : 60,7.
Densité du jus : 1067,4 - Alcool en puissance : 8° 6.
Acidité de titration en g. SO'H: par litre : 1,25.
Azote/sucres totaux : 0,39.
Tanin (en g. par litre) : 1,33.
Aspect du jus : légèrement teinté.
Parfum : agréable.
QUALITES CULTURALES DE L'ARBRE
Vigueur : bonne. Pousses droites et longues chez les arbres jeunes.
Port : dressé.
Résistance aux maladies : variété des plus rustiques.
Productivité : très bonne.
Saison de floraison : 4°.
Saison de maturité : 3°.
Conservation et transport des fruits : bons.
Calibre du fruit : moyen.
Précocité de mise à fruits : moyenne.
OBSERVATIONS DIVERSES
Variété faisant de beaux arbres bien équilibrés. Floraison très tardive
ne craignant pas les gelées. Fruits aptes à la fabrication de cidres se
conservant naturellement doux.
Variété d'assez grande souplesse d'adaptation, réussissant en Bretagne
où elle a été introduite en différents endroits depuis assez longtemps.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1*') @
Edition 1965"""

