texte_ocr = """
Réaction à l'éclaircissage chimique : moyenne. Effet stressant des hormones (ANA) sur le développement
des fruits (présence de fruits « pygmées » à la récolte)
Formation de l'arbre :
A la plantation, le scion est souvent peu ramifié. Sa croissance est assez faible : la gestion de la charge par un
éclaircissage adapté est indispensable pour un bon développement de l'arbre les premières années.
Les charpentières sont réparties de façon équilibrée sur le tronc. Quelques ramifications plus vigoureuses
peuvent nécessiter une arcure ou une suppression.
Dans l'ensemble, la conduite est assez facile.
Sa croissance modérée associée à sa forte productivité pose souvent problème pour le maintien de l'axe droit :
des pincements de l'axe pour le renforcer ou un palissage haut, accompagnés d'un éclaircissage en tête,
permettent de conserver la verticalité de l'axe.
Maintenir des branches érigées en partie supérieure de l'arbre contribue aussi à renforcer l'axe et le rigidifier.
Calibre : moyen à gros (70-80 g)
Forme : fruit avoïde à aplati (rouge strié)
Epoque de récolte : fin octobre à début novembre
Particularités :
Conservation au sol : bonne
Régression de l'amidon : totale
pH:4,1à4,7
Conditions d'extraction : à préciser
Saveur du moût : douce amère
Cidre : moyennement tannique (amertume et astringence plus perceptibles que sur les cidres mono-variétaux
de variétés douce-amères françaises type Douce Moën, Bedan, Bisquet, Binet Rouge, …)
Fiche réalisée avec la collaboration de l'ensemble des techniciens de la filière cidricole."""

