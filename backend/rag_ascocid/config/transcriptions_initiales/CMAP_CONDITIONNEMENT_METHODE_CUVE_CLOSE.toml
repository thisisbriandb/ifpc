texte_ocr = """
La méthode de conditionnement avec prise de mousse en cuve close
est une : Modalité de l’étape de conditionnement et obtention de l’effervescence des cidres
est constituée de : Un levurage par des levures sèches actives (facultatif) | Une prise de mousse en cuve close (PMC) | Une élimination des levures sous contre -pression | Un embouteillage iso -barométrique en bouteille | Un bouchage & muselage
a pour action complémentaire : Un sulfitage (facultatif)
a pour fonctions : De produire un cidre limpide à effervescence naturelle | D’obtenir un cidre prêt à la commercialisation dès l’embouteillage
a pour conséquences : Une limitation de la quantité de flores indésirables en bouteille | Un coût d’investissement élevé (cuve résistant à la pression et soutireuse iso -barométrique) | Une consommation de sucre pour la prise de mousse (environ 4 points de MV) | De différer l’embouteillage (1 à 2 mois de fermentation en cuve close)
présente le risque : D’une oxygénation du cidre à l’embouteillage | D’une dissolution de CO 2 exogène lors du soutirage (au -delà de la limite de détection)"""

