texte_ocr = """
Variété: BLANC SUR
PRINCIPALES ZONES DE PRODUCTION
Sarthe : Nord-Ouest du département (Fresnay-sur-Sarthe
- Beaumont-sur-Sarthe).
CARACTERISTIQUES TECHNOLOGIQUES DU FRUIT
(Moyenne des analyses effectuées
à la Station cidricole de Rennes INRA)
Poids moyen du fruit (g.): 99.
Rendement en jus (%): 72,5.
Densité du jus : 1,0578.
Sucres totaux (en g. par litre): 125,1.
Acidité de titration (en g. H,SO, par litre): 5,3.
(en m.eq.) : 108.
Rapport sucres/acidité : 23,6.
Extrait sec réduit (en g. par litre): 23,9.
Tanins (en g. par litre) : 0,99.
Couleur du jus : jaune très pâle.
Dégustation : aigre, sans parfum.
CARACTERISTIQUES CULTURALES DE L'ARBRE
Vigueur : moyenne à grande.
Port: semi-étalé.
Résistance aux maladies : assez rustique - mais parfois un peu sensible
à l'oidium et au chancre ainsi qu'à la tavelure en sol calcaire.
Mise à fruits : assez rapide.
Productivité : moyenne et assez régulière.
Saison de floraison : 4e.
Saison de maturité : 2e.
Calibre du fruit: moyen.
Conservation et transport des fruits: se marquent au transport mais se
conservent bien.
OBSERVATIONS DIVERSES
Il convient d'être prudent en ce qui concerne l'extension de cette variété.
Ne se plait pas en sol calcaire, recherche des terrains acides.
Les fruits doivent être cueillis assez tôt car ils tombent facilement.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1*)
Documentation I.N.R.A. - Edition 1973"""

