texte_ocr = """
Variété: SAINT-MARTIN
PRINCIPALES ZONES DE PRODUCTION
Calvados : Pays d'Auge.
POSSIBILITES DE COMMERCIALISATION
en bonne année : 1.500 tonnes.
Ph. Desmier de Chenon
QUALITES TECHNOLOGIQUES DU FRUIT
(moyenne de deux analyses de MM. Tavernier et Jacquin
des 29-12-1949 et 31-1-1966)
Dégustation du jus : doux légèrement amer.
Dégustation du cidre : doux avec un peu d'amertume.
Rendement en jus (%) : 55,4.
Densité du jus : 1061,6 - Alcool en puissance : 7° 9.
Acidité de titration en g. SO'H: par litre : 1,9.
Azote/sucres totaux : 0,57.
Tanin (en g. par litre) : 2,36.
QUALITES CULTURALES DE L'ARBRE
Vigueur : très grande.
Port : secteur sphérique étroit.
Résistance aux maladies : grande. Tavelure et oïdium plutôt exceptionnels.
Productivité : grande.
Saison de floraison : 3°.
Saison de maturité : début 3e.
Conservation et transport des fruits : très bons.
Calibre du fruit : petit en très forte production - plutôt gros en production
normale.
Précocité de mise à fruits : assez bonne.
OBSERVATIONS DIVERSES
Fruits de grosseur variable suivant l'importance de la récolte.
Arbre pouvant devenir très volumineux en terrain riche.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1°') @)
Edition 1965"""

