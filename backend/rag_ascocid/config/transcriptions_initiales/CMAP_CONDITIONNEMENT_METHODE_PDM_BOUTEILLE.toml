La méthode de conditionnement avec prise de mousse en bouteille
est une : Modalité de l’étape de conditionnement et obtention de l’effervescence des cidres
est constituée de : Un levurage par des levures sèches actives (facultatif) | Un embouteillage de cidre plat | Un bouchage & muselage | Une prise de mousse en bouteille
a pour action complémentaire : Un sulfitage (facultatif)
a pour fonctions : De produire un cidre à effervescence naturelle | De limiter l’investissement lié au conditionnement (faibles volumes produits)
a pour conséquences : Une limitation de l’oxydation du cidre (consommation d’oxygène par les levures) | La présence éventuelle d’un trouble et/ou d’un dépôt en bouteille | De différer la mise en vente (1 à 2 mois de fermentation en bouteille) | Une consommation de sucre pour la prise de mousse (environ 4 points de MV)
présente les risques : D’une sur -gazéification en bouteille pouvant conduire à l’explosion de bouteilles | D’une sous -gazéification en bouteille | D’une contamination ou d’un maintien de flores indésirables | La présence de notes soufrées et/ou « levures »"""

