Variété : GUILLEVIC
PRINCIPALES ZONES DE PRODUCTION
Morbihan: Auray - Nord de Vannes - Hennebont -
Pluvigner - Baud.
CARACTERISTIQUES TECHNOLOGIQUES DU FRUIT
(Moyenne des analyses effectuées
à la Station cidricole de Rennes INRA)
Poids moyen du fruit (g.): 66,6.
Rendement en jus (%): 63,1.
Densité du jus : 1,0645.
Sucres totaux (en g. par litre): 137,2.
Acidité de titration (en g. H.SO, par litre): 4,7.
(en m.eq.) : 95.
Rapport sucres/acidité : 29,1.
Extrait sec réduit (en g. par litre): 25,3.
Tanins (en g. par litre) : 1,45.
Couleur du jus : jaune doré.
Dégustation : acidulé, bien parfumé.
CARACTERISTIQUES CULTURALES DE L'ARBRE
Vigueur : moyenne à grande.
Port: érigé puis très étalé.
Résistance aux maladies : variété très rustique.
Mise à fruits : peu rapide.
Productivité : bonne, mais alternante.
Saison de floraison : 2e-3%e.
Saison de maturité : 2°.
Calibre du fruit: moyen à gros.
Conservation et transport des fruits : bons.
OBSERVATIONS DIVERSES
Pommes excellentes pour la fabrication des jus et des cidres de couleur
claire. |
Variété pouvant se brasser seule.
La formation des arbres est facile.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1#)
Documentation I.N.R.A. - Edition 1973 ©)"""

