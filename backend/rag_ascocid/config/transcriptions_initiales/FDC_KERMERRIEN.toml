texte_ocr = """
Formation de l'arbre :
A la plantation, le scion a souvent de nombreux anticipés à angle fermé. 3 à 5 anticipés bien répartis le long du
tronc et parmi les plus ouverts, peuvent être conservés.
Les premières années, la vigueur est très forte (croissance forte, érigée) sur M106 d'où un retard de la mise à
fruits d'un an. Une suppression trop importante de branches ne fait que renforcer cette vigueur : Une arcure
sous l'horizontale des dominantes non supprimées, est possible, en les vrillant par exemple.
Par la suite, lorsque l'arbre a commencé à produire, la conduite est relativement facile car la variété est très
ramifiée et l'axe assez dominant. Cependant, le problème de croissance tardive et d'annulation du bourgeon
terminal provoque souvent des fléchissement des axes, renforcé par une surcharge de fruits.
Une sélection rapide des branches de la base de l'arbre favorisera :
- La présence de lumière et des ramifications nombreuses
- un renforcement de la partie haute de l'arbre et un axe bien droit
Calibre : moyen (36 à 57g)
Forme : conique, bicolore à rouge.
Epoque de récolte : fin septembre - début octobre
Particularités : variété dont la maturité des fruits
avance depuis quelques années !
Conservation au sol : moyenne (sensible aux
champignons du sol : Phytophthora, Alternaria,
Mucor)
Régression de l’amidon : très partielle à maturité >
(40-60 % de régression)
FU | we [nom | mon |
ais at bte) _ mn |
pH :3,8-4,1
Conditions d'extraction : présence d’amidon parfois en grande quantité pouvant poser des problèmes.
Saveur du moût : douce amère, légèrement parfumée.
Cidre : saveur amère.
Fiche réalisée avec la collaboration de l’ensemble des techniciens de la filière cidricole."""

