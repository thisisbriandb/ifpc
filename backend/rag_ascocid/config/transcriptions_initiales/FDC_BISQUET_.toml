*> BISQ ET
C\\ieec > BISQUET
— Porc Clone indemne : X5102
CIORIQOLES Variété implantée principalement en Normandie
(5,6% des surfaces en basse tige).
Variété douce amère à maturité à partir de mi-octobre.
Variété productive, peu alternante mais nécessitant des interventions éclaircissage; la richesse en sucres des
fruits est insuffisante (masse volumique des moûts faible).
Lorsque les branches érigées des premières années ont été gérées correctement, la conduite de l'arbre est
assez simple.
Bisquet est inscrite au catalogue CTPS parmi les variétés recommandées pour la production.
