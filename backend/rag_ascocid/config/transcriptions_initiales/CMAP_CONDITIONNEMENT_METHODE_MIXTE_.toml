texte_ocr = """
La méthode de conditionnement à effervescence « mixte » (gazéification en présence de levures)
est une : Modalité de l’étape de conditionnement et obtention de l’effervescence des cidres
est constitué de : Un faible levurage par des levures sèches actives | Une gazéification en saturateur | Un embouteillage iso-barométrique | Un bouchage & muselage
a pour action complémentaire : Un sulfitage (facultatif)
a pour fonctions : De produire un cidre effervescent par un apport contrôlé de CO, exogène | D'obtenir rapidement un cidre prêt à la commercialisation | De consommer l’oxygène par les levures présentes
a pour conséquences : De limiter la quantité de flores indésirables en bouteille | De générer un léger trouble ou dépôt en bouteille
présente le risque : D'une sur-gazéification due à une croissance des levures ajoutées (explosion des bouteilles)"""

