texte_ocr = """
Variété: RENÉ MARTIN
PRINCIPALES ZONES DE PRODUCTION
(département et cantons)
Calvados : Livarot - Mesnil Guillaume - St Gabriel.
POSSIBILITES de COMMERCIALISATION en bonne année
Tonnage insignifiant
QUALITES TECHNOLOGIQUES DU FRUIT
(analyse du Laboratoire de Caen le 22-12-60)
Dégustation du fruit : acide, peu sucré.
Dégustation du jus : très acide avec pointe d'amertume.
Rendement en jus (%) : 70.
Densité du jus : 1 048,8.
Acidité de titration en g. SO* H° par litre : 5,92.
Azote/Sucres totaux : 0,37.
Tanin (en g. par litre) : 1,90.
Couleur du jus : assez pâle.
Parfum : faible.
QUALITES CULTURALES DE L'ARBRE
Vigueur : bonne.
Port : légèrement érigé chez les arbres jeunes.
Résistance aux maladies : sensible à la tavelure des feuilles et des fruits
2 années sur 10.
Productivité : bonne - mais alternante.
Saison de floraison : 3e.
Saison de maturité : 2°-3e.
Conservation et transport des fruits : bons pour des fruits de 2e saison.
Grosseur du fruit : au-dessous de la moyenne.
OBSERVATIONS DIVERSES
Variété très localisée, de dispersion récente, inconnue en dehors du
Calvados. À ne pas planter dans les lieux favorables à la tavelure.
Comité des Fruits à Cidre et des Productions Cidricoles - 42, rue du Louvre - Paris (1*r)
Edition 1963"""

