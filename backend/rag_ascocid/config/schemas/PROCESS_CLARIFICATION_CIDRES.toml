[[transitions]]
de = "fine_sc"
produit = "Cidres clarifiés prêts à la mise"

# Avec collage : une centrifugation préalable est dessinée en dérivation
# (facultative) avant le collage.
[[transitions]]
vers = "centrifugation_ac"
produit = "Cidres assemblés"
condition = "clarification avec collage"

[[transitions]]
vers = "collage"
produit = "Cidres assemblés"
condition = "clarification avec collage"

[[transitions]]
de = "centrifugation_ac"
vers = "collage"

[[transitions]]
de = "collage"
vers = "soutirage_collage"

[[transitions]]
de = "soutirage_collage"
vers = "grossiere_ac"
produit = "Cidre collé"

# Dérivation dessinée à droite : la séparation grossière peut être évitée.
[[transitions]]
de = "soutirage_collage"
vers = "fine_ac"
produit = "Cidre collé"

[[transitions]]
de = "grossiere_ac"
vers = "fine_ac"
produit = "Cidre collé et centrifugé"

[[transitions]]
de = "fine_ac"
produit = "Cidres collés prêts à la mise"

